<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MigraNote">
<meta name="mobile-web-app-capable" content="yes">
<title>MigraNote</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#26223a;--mut:#7a7590;--pri:#7c5cd6;--on:#fff;--pri2:#ece6fb;--line:#e6e2f0;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131f;--card:#211d2e;--tx:#f1eefb;--mut:#a39db8;--pri:#a78bfa;--on:#1b1530;--pri2:#2e2745;--line:#332d46;--bad:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16131f;--card:#211d2e;--tx:#f1eefb;--mut:#a39db8;--pri:#a78bfa;--on:#1b1530;--pri2:#2e2745;--line:#332d46;--bad:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 18px 40px}
h1{font-size:34px;margin:8px 0 4px;letter-spacing:-.5px}h2{font-size:24px;margin:12px 0}
.mut{color:var(--mut);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.big{width:100%;min-height:120px;border-radius:28px;background:var(--pri);color:var(--on);font-size:26px;font-weight:700;margin:18px 0;box-shadow:0 8px 24px rgba(124,92,214,.35)}
.btn{display:block;width:100%;min-height:54px;border-radius:16px;background:var(--pri);color:var(--on);font-weight:600;margin:10px 0}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.del{background:none;color:var(--bad);border:1px solid var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nav{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;font-size:15px;font-weight:600;color:var(--pri)}
.nav b{display:block;font-size:26px}
.num{font-size:40px;font-weight:700;color:var(--pri);line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 16px;border-radius:999px;background:var(--pri2);color:var(--tx);border:2px solid transparent;font-size:17px}
.chip.on{background:var(--pri);color:var(--on)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.tag{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600}
.tag.warn{background:#fdeccf;color:#8a5a00}
.ok{background:var(--pri2);border-radius:18px;padding:14px 16px;font-weight:600;color:var(--pri)}
.back{color:var(--pri);font-weight:600;padding:8px 0;font-size:18px}
input[type=range]{width:100%;accent-color:var(--pri);height:40px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
textarea{min-height:90px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:13px;color:var(--mut)}
.d{aspect-ratio:1;border-radius:12px;font-size:17px;background:none}
.d.hit{background:var(--pri);color:var(--on);font-weight:700}.d.sel{outline:3px solid var(--pri2);outline-offset:1px}.d.today{border:2px solid var(--pri)}
.bar{height:14px;border-radius:7px;background:var(--pri);min-width:4px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars div{flex:1;text-align:center;font-size:13px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .bar{width:100%;height:auto;border-radius:8px 8px 0 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal>div{background:var(--card);border-radius:22px;padding:22px;max-width:380px;width:100%}
.err{background:#fde2de;color:#8a1f12;border-radius:14px;padding:12px;margin:8px 0;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:16px;z-index:30}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K="migranote.v1";
var FAC=["Sforzo fisico","Stress","Poco sonno","Stanchezza","Pasto saltato","Nessuna causa evidente","Altro"];
var DUR=[["corso","Ancora in corso",null],["lt1","Meno di un’ora",0.5],["1-4","1-4 ore",2.5],["4-12","4-12 ore",8],["12-24","12-24 ore",18],["gt24","Più di 24 ore",30]];
var MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
var S={a:[],seen:false,cf:[],prem:false},X={p:"90",name:"",notes:true,chart:true},err="",view="home",cur=null,fresh=false,modal="";
var now=new Date(),cY=now.getFullYear(),cM=now.getMonth(),selDay=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){try{var r=localStorage.getItem(K);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.a))S={a:d.a,seen:!!d.seen,cf:Array.isArray(d.cf)?d.cf:[],prem:!!d.prem}}}catch(e){err="Impossibile leggere i dati salvati su questo dispositivo."}}
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){err="Salvataggio non riuscito: controlla che il browser consenta l’archiviazione locale.";var x=$("errbox");if(x)x.innerHTML=esc(err);return false}}
function p2(n){return n<10?"0"+n:""+n}
function dk(ts){var d=new Date(ts);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function loc(ts){var d=new Date(ts);return dk(ts)+"T"+p2(d.getHours())+":"+p2(d.getMinutes())}
function fmt(ts){return new Date(ts).toLocaleString("it-IT",{weekday:"short",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function get(id){return S.a.find(function(a){return a.id===id})}
function sorted(){return S.a.slice().sort(function(x,y){return y.ts-x.ts})}
function incomplete(a){return a.int==null||!a.dur}
function durLabel(k){var d=DUR.find(function(x){return x[0]===k});return d?d[1]:"—"}
function go(v,id){view=v;cur=id||null;modal="";render();window.scrollTo(0,0)}
function toast(t){var e=document.createElement("div");e.id="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},1800)}

function newAttack(){var a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),f:[],int:null,dur:null,note:""};S.a.push(a);save();fresh=true;go("edit",a.id)}
function togF(f){var a=get(cur);if(!a)return;var i=a.f.indexOf(f);if(i<0)a.f.push(f);else a.f.splice(i,1);save();render()}
function setDur(k){var a=get(cur);if(!a)return;a.dur=a.dur===k?null:k;save();render()}
function setInt(v){var a=get(cur);if(!a)return;a.int=+v;$("ival").textContent=v+" / 10";save()}
function setNote(v){var a=get(cur);if(a){a.note=v;save()}}
function setDate(v){var a=get(cur),t=new Date(v).getTime();if(a&&!isNaN(t)){a.ts=t;save()}}
function done(later){if(later)toast("Salvato: potrai completarlo dopo");else toast("Salvato");fresh=false;go("home")}
function askDel(id){modal="del";cur=id;render()}
function doDel(){S.a=S.a.filter(function(a){return a.id!==cur});save();fresh=false;toast("Registrazione eliminata");go("hist")}
function askAll(){modal="all";render()}
function doAll(){S.a=[];save();toast("Tutti i dati cancellati");go("home")}
function start(){S.seen=true;save();render()}

function vWelcome(){return '<h1>MigraNote</h1><p class="mut">Il tuo diario dell’emicrania</p><div class="card"><p>MigraNote serve a tenere traccia dei tuoi attacchi di emicrania, in un tocco solo.</p><p>Premi un pulsante quando inizia l’attacco: data e ora vengono salvate subito. I dettagli puoi aggiungerli quando vuoi.</p><p class="mut">Nessun account. I dati restano solo su questo dispositivo. Nessuna pubblicità.</p></div><button class="btn" onclick="start()">Inizia subito</button>'}

function vHome(){var l=sorted(),last=l[0];
return '<h1>MigraNote</h1><p class="mut">Il tuo diario dell’emicrania</p>'+(err?'<div class="err" id="errbox">'+esc(err)+'</div>':'<div id="errbox"></div>')+
'<button class="big" onclick="newAttack()">REGISTRA ATTACCO</button>'+
'<div class="grid"><div class="card"><div class="mut">Attacchi totali</div><div class="num">'+S.a.length+'</div></div>'+
'<div class="card"><div class="mut">Ultimo attacco</div><div style="font-weight:600;margin-top:6px">'+(last?esc(new Date(last.ts).toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}))+'<br><span class="mut">'+new Date(last.ts).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+'</span>':'<span class="mut">Nessuno</span>')+'</div></div></div>'+
'<div class="grid3"><button class="nav" onclick="go(\'cal\')"><b>📅</b>Calendario</button><button class="nav" onclick="go(\'hist\')"><b>📋</b>Storico</button><button class="nav" onclick="go(\'stats\')"><b>📊</b>Statistiche</button></div>'+
'<button class="btn sec" style="margin-top:22px" onclick="go(\'priv\')">Privacy e backup</button><button class="btn sec" onclick="go(\'prem\')">★ Premium</button>'}

function vEdit(){var a=get(cur);if(!a){return '<button class="back" onclick="go(\'home\')">‹ Home</button><div class="err">Registrazione non trovata.</div>'}
var h='';
if(fresh)h+='<div class="ok">✓ Attacco registrato<br><span class="mut">'+esc(fmt(a.ts))+'</span></div><p class="mut">Se vuoi, aggiungi qualche dettaglio. Tutto è facoltativo.</p>';
else h+='<button class="back" onclick="go(\'hist\')">‹ Storico</button><h2>Modifica attacco</h2>';
h+='<div class="card"><b>Data e ora</b><input type="datetime-local" value="'+loc(a.ts)+'" onchange="setDate(this.value)" style="margin-top:8px"></div>';
h+='<div class="card"><b>Cosa è successo prima?</b><p class="mut" style="margin:2px 0 10px">Puoi sceglierne più di uno</p><div class="chips">'+FAC.map(function(f,i){return '<button class="chip'+(a.f.indexOf(f)>=0?' on':'')+'" onclick="togF(FAC['+i+'])">'+f+'</button>'}).join('')+'</div></div>';
h+='<div class="card"><div class="row"><b>Intensità del dolore</b><span class="tag" id="ival">'+(a.int==null?'non indicata':a.int+' / 10')+'</span></div><input type="range" min="1" max="10" value="'+(a.int==null?5:a.int)+'" oninput="setInt(this.value)" onchange="setInt(this.value)"><div class="row mut"><span>1 lieve</span><span>10 fortissimo</span></div></div>';
h+='<div class="card"><b>Durata</b><div class="chips" style="margin-top:10px">'+DUR.map(function(d){return '<button class="chip'+(a.dur===d[0]?' on':'')+'" onclick="setDur(\''+d[0]+'\')">'+d[1]+'</button>'}).join('')+'</div></div>';
h+=cuHtml(a);h+='<div class="card"><b>Note</b><textarea placeholder="Scrivi quello che vuoi…" oninput="setNote(this.value)" style="margin-top:8px">'+esc(a.note)+'</textarea></div>';
h+='<div id="errbox">'+(err?'<div class="err">'+esc(err)+'</div>':'')+'</div>';
if(fresh)h+='<button class="btn" onclick="done(false)">SALVA</button><button class="btn sec" onclick="done(true)">SALVA E COMPLETA DOPO</button>';
else h+='<button class="btn" onclick="done(false)">Salva</button><button class="btn del" onclick="askDel(\''+a.id+'\')">Elimina registrazione</button>';
return h}

function item(a){return '<button class="card row" onclick="fresh=false;go(\'edit\',\''+a.id+'\')"><div><b>'+esc(fmt(a.ts))+'</b><div class="mut">'+(a.int!=null?'Intensità '+a.int+'/10':'Intensità —')+' · '+esc(durLabel(a.dur))+'</div></div>'+(incomplete(a)?'<span class="tag warn">Da completare</span>':'<span class="tag">Completo</span>')+'</button>'}

function vHist(){var l=sorted();return '<button class="back" onclick="go(\'home\')">‹ Home</button><h2>Storico</h2>'+(l.length?l.map(item).join(''):'<p class="mut">Nessun attacco registrato.</p>')}

function vCal(){var first=new Date(cY,cM,1),off=(first.getDay()+6)%7,n=new Date(cY,cM+1,0).getDate(),hits={};
S.a.forEach(function(a){hits[dk(a.ts)]=1});var td=dk(Date.now());
var h='<button class="back" onclick="go(\'home\')">‹ Home</button><div class="row"><button class="back" onclick="mv(-1)">‹</button><h2>'+MESI[cM]+' '+cY+'</h2><button class="back" onclick="mv(1)">›</button></div><div class="card"><div class="cal">';
["L","M","M","G","V","S","D"].forEach(function(x){h+='<div class="h">'+x+'</div>'});
for(var i=0;i<off;i++)h+='<div></div>';
for(var d=1;d<=n;d++){var k=cY+"-"+p2(cM+1)+"-"+p2(d);h+='<button class="d'+(hits[k]?' hit':'')+(k===selDay?' sel':'')+(k===td?' today':'')+'" onclick="selDay=\''+k+'\';render()">'+d+'</button>'}
h+='</div></div>';
if(selDay){var l=sorted().filter(function(a){return dk(a.ts)===selDay});h+='<h2 style="font-size:20px">'+esc(new Date(selDay+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}))+'</h2>'+(l.length?l.map(item).join(''):'<p class="mut">Nessun attacco in questa data.</p>')}
else h+='<p class="mut">I giorni colorati hanno almeno un attacco. Tocca un giorno per vederli.</p>';
return h}
function mv(d){cM+=d;if(cM<0){cM=11;cY--}if(cM>11){cM=0;cY++}selDay=null;render()}

function vStats(){var h='<button class="back" onclick="go(\'home\')">‹ Home</button><h2>Statistiche</h2>';
if(!S.a.length)return h+'<p class="mut">Registra il primo attacco per vedere le statistiche.</p>';
var days={};S.a.forEach(function(a){days[dk(a.ts)]=1});
var ints=S.a.filter(function(a){return a.int!=null}).map(function(a){return a.int});
var hrs=S.a.map(function(a){var d=DUR.find(function(x){return x[0]===a.dur});return d&&d[2]!=null?d[2]:null}).filter(function(x){return x!=null});
var avg=function(l){return l.length?l.reduce(function(s,x){return s+x},0)/l.length:null};
var ai=avg(ints),ah=avg(hrs);
h+='<div class="grid"><div class="card"><div class="mut">Attacchi totali</div><div class="num">'+S.a.length+'</div></div><div class="card"><div class="mut">Giorni con attacchi</div><div class="num">'+Object.keys(days).length+'</div></div><div class="card"><div class="mut">Intensità media</div><div class="num">'+(ai==null?'—':ai.toFixed(1).replace(".",","))+'</div></div><div class="card"><div class="mut">Durata media</div><div class="num" style="font-size:'+(ah==null?40:30)+'px">'+(ah==null?'—':(ah<1?'< 1 ora':'~'+ah.toFixed(1).replace(".",",")+' ore'))+'</div></div></div>';
if(ah!=null)h+='<p class="mut">La durata media è stimata dal centro di ogni fascia; gli attacchi “ancora in corso” sono esclusi.</p>';
var ms=[],c=new Date();for(var i=5;i>=0;i--){var d=new Date(c.getFullYear(),c.getMonth()-i,1);ms.push({y:d.getFullYear(),m:d.getMonth(),n:0})}
S.a.forEach(function(a){var d=new Date(a.ts);ms.forEach(function(x){if(x.y===d.getFullYear()&&x.m===d.getMonth())x.n++})});
var mx=Math.max.apply(null,ms.map(function(x){return x.n}).concat([1]));
h+='<div class="card"><b>Attacchi per mese</b><div class="bars" style="margin-top:12px">'+ms.map(function(x){return '<div><span style="color:var(--tx);font-weight:600">'+x.n+'</span><span class="bar" style="height:'+Math.max(4,x.n/mx*90)+'px"></span>'+MESI[x.m].slice(0,3)+'</div>'}).join('')+'</div></div>';
var fc={};S.a.forEach(function(a){a.f.forEach(function(f){fc[f]=(fc[f]||0)+1})});
var fl=Object.keys(fc).sort(function(x,y){return fc[y]-fc[x]});
h+='<div class="card"><b>Fattori più frequenti</b>'+(fl.length?fl.map(function(f){return '<div style="margin-top:12px"><div class="row"><span>'+esc(f)+'</span><b>'+fc[f]+'</b></div><div class="bar" style="width:'+fc[f]/fc[fl[0]]*100+'%"></div></div>'}).join(''):'<p class="mut">Nessun fattore selezionato finora.</p>')+'</div>';
return h}

function vPriv(){return '<button class="back" onclick="go(\'home\')">‹ Home</button><h2>Privacy e dati</h2>'+
'<div class="card"><b>Informativa privacy</b><p>I tuoi dati sanitari sono salvati solo su questo dispositivo, nella memoria locale del browser. Non serve alcun account, non viene raccolto nulla e nessun dato viene inviato a terze parti. Nessuna pubblicità. Un eventuale backup o condivisione futura avverrà solo con il tuo consenso esplicito.</p><p class="mut">Attenzione: cancellare i dati del sito da Safari elimina anche il diario. Fai un backup ogni tanto.</p></div>'+
'<div class="card"><b>Backup manuale</b><p class="mut">Copia il testo del backup e conservalo (es. in Note). Per ripristinare, incollalo qui sotto.</p><textarea id="bk" placeholder="Incolla qui un backup…"></textarea><button class="btn" onclick="bkCopy()">Copia backup</button><button class="btn sec" onclick="bkRest()">Ripristina da testo incollato</button></div>'+
'<button class="btn sec" onclick="go(\'prem\')">Premium e funzioni extra</button>'+
'<button class="btn del" onclick="askAll()">Cancella tutti i dati</button>'}
function bkCopy(){var t=JSON.stringify({app:"migranote",v:2,a:S.a,cf:S.cf}),ta=$("bk");ta.value=t;
function fb(){ta.select();ta.setSelectionRange(0,t.length);try{document.execCommand("copy");toast("Backup copiato")}catch(e){toast("Seleziona e copia il testo")}}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Backup copiato")},fb)}else fb()}
function bkRest(){try{var d=JSON.parse($("bk").value);if(!d||d.app!=="migranote"||!Array.isArray(d.a))throw 0;
var ok=d.a.every(function(a){return a&&typeof a.id==="string"&&typeof a.ts==="number"&&Array.isArray(a.f)});if(!ok)throw 0;
var ids={};S.a.forEach(function(a){ids[a.id]=1});var n=0;d.a.forEach(function(a){if(!ids[a.id]){S.a.push({id:a.id,ts:a.ts,f:a.f.filter(function(x){return typeof x==="string"}),int:typeof a.int==="number"?a.int:null,dur:typeof a.dur==="string"?a.dur:null,note:typeof a.note==="string"?a.note:"",cu:a.cu&&typeof a.cu==="object"?a.cu:{}});n++}});
if(Array.isArray(d.cf)){var fi={};S.cf.forEach(function(f){fi[f.id]=1});d.cf.forEach(function(f){if(f&&typeof f.id==="string"&&typeof f.name==="string"&&!fi[f.id])S.cf.push({id:f.id,name:f.name,type:["check","num","text"].indexOf(f.type)>=0?f.type:"text"})})}save();toast(n+" attacchi ripristinati");render()}catch(e){toast("Backup non valido")}}

/* ===== MODULO Entitlements: unica fonte di verità per Premium. In app nativa: provider = ponte StoreKit 2 ===== */
var Ent={provider:null,active:function(){return this.provider?!!this.provider.active():!!S.prem}};
function premLinks(){var l=Ent.active()?'':' 🔒';return '<button class="btn sec" onclick="go(\'adv\')">Statistiche avanzate'+l+'</button><button class="btn sec" onclick="go(\'exp\')">Report PDF e CSV'+l+'</button>'}
function vPrem(){var on=Ent.active();
return '<button class="back" onclick="go(\'home\')">‹ Home</button><h1>Premium</h1><div class="ok">Gratis per sempre e senza pubblicità: registrazione illimitata degli attacchi, data e ora modificabili, domande facoltative, intensità, durata, note, calendario, storico, statistiche di base e salvataggio locale.</div>'+
'<div class="card"><div class="row"><b>Il tuo piano</b><span class="tag">'+(on?'Premium (anteprima test)':'Gratuito')+'</span></div></div>'+
'<div class="card"><b>Incluso in Premium</b><p>• Statistiche avanzate e confronti<br>• Report PDF personalizzabili e condivisibili<br>• Esportazione CSV<br>• Campi personalizzati</p><button class="btn sec" onclick="go(\'adv\')">Statistiche avanzate</button><button class="btn sec" onclick="go(\'exp\')">Report PDF e CSV</button><button class="btn sec" onclick="go(\'fields\')">Campi personalizzati</button></div>'+
'<div class="card"><b>Abbonamento</b><p class="mut">Mensile e annuale tramite Apple In-App Purchase. Non attivo in questa versione: richiede l’app iOS nativa (StoreKit 2), un account Apple Developer e i prodotti configurati in App Store Connect. Qui nessun pagamento è possibile.</p><button class="btn" disabled style="opacity:.45">Mensile · non disponibile</button><button class="btn" disabled style="opacity:.45">Annuale · non disponibile</button></div>'+
'<div class="card"><b>Sincronizzazione tra dispositivi Apple</b><p class="mut">Non implementata in questa versione web: serve iCloud (CloudKit) nell’app nativa. Per ora esiste solo il backup manuale in Privacy e backup.</p></div>'+

function q(v){var s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function expCsv(){var cf=S.cf,r=[["Data","Ora","Intensità","Durata","Fattori","Note"].concat(cf.map(function(f){return f.name})).map(q).join(",")];
xl().forEach(function(a){var d=new Date(a.ts);r.push([dk(a.ts),p2(d.getHours())+":"+p2(d.getMinutes()),a.int==null?"":a.int,a.dur?durLabel(a.dur):"",a.f.join("; "),X.notes?a.note:""].concat(cf.map(function(f){var v=(a.cu||{})[f.id];return f.type==="check"?(v?"Sì":""):(v==null?"":v)})).map(q).join(","))});
saveF("migranote.csv","\ufeff"+r.join("\r\n"))}

function buildPdf(){var l=xl().reverse().reverse(),c=calc(l),P=[],ops=[],y=800,i;

function tx(t,s,b){var mx=Math.floor(520/(s*0.5)),ls=[];String(t).split("\n").forEach(function(ln){var cu="";ln.split(" ").forEach(function(w){if((cu+" "+w).length>mx&&cu){ls.push(cu);cu=w}else cu=cu?cu+" "+w:w});ls.push(cu)});ls.forEach(function(x){if(y<60)np();ops.push("BT /F"+(b?2:1)+" "+s+" Tf 40 "+y+" Td ("+pe(x)+") Tj ET");y-=s*1.5})}
tx("MigraNote - Report emicrania",20,1);if(X.name)tx("Nome: "+X.name,12);
tx("Periodo: "+(X.p==="0"?"tutto lo storico":"ultimi "+X.p+" giorni")+" - creato il "+new Date().toLocaleDateString("it-IT"),11);y-=8;

ms.forEach(function(m,k){var h=m[1]/mx*80,x=60+k*80;ops.push("0.49 0.36 0.84 rg "+x+" "+(y-90)+" 50 "+Math.max(h,1)+" re f");ops.push("0 g BT /F1 10 Tf "+x+" "+(y-102)+" Td ("+pe(m[0]+" "+m[1])+") Tj ET")});y-=125}
var fl=Object.keys(c.fc).sort(function(a,b){return c.fc[b]-c.fc[a]});if(fl.length){tx("Fattori più frequenti",14,1);fl.forEach(function(f){tx(f+": "+c.fc[f],11)});y-=8}

l.forEach(function(a){var s=fmt(a.ts)+" | Intensità "+(a.int==null?"-":a.int+"/10")+" | "+(a.dur?durLabel(a.dur):"durata -");if(a.f.length)s+="\nFattori: "+a.f.join(", ");var cu=a.cu||{};S.cf.forEach(function(f){var v=cu[f.id];if(v!==undefined&&v!==""&&v!==false)s+="\n"+f.name+": "+(v===true?"Sì":v)});if(X.notes&&a.note)s+="\nNote: "+a.note;tx(s,10);y-=4});
