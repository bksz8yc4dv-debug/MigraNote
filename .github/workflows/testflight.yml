name: Upload MigraNote to TestFlight

on:
  workflow_dispatch:

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
          working-directory: ios
      - name: Install Fastlane
        working-directory: ios
        run: bundle install
      - name: Install XcodeGen and SVG converter
        run: brew install xcodegen librsvg
      - name: Generate app icon
        run: bash ios/scripts/generate-app-icon.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build and upload TestFlight
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: bundle exec fastlane ios beta
