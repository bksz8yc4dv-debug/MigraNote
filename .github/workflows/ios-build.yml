name: iOS build and tests

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: migranote-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Initialize simulator services and install runtime
        run: |
          open -a Simulator || true
          xcrun simctl list devices available
          xcodebuild -downloadPlatform iOS
      - name: Build and run unit tests
        working-directory: ios
        run: xcodebuild test -project MigraNote.xcodeproj -scheme MigraNote -destination 'platform=iOS Simulator,name=iPhone 16' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MigraNote-iOS-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/MigraNote.app
          if-no-files-found: error
