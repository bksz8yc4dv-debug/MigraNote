name: iOS build

on:
  push:
    branches:
      - ios-native
  pull_request:
    branches:
      - ios-native
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: xcodebuild -project MigraNote.xcodeproj -scheme MigraNote -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
