name: iOS build and tests

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: migranote-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and SVG converter
        run: brew install xcodegen librsvg
      - name: Generate app icon
        run: bash ios/scripts/generate-app-icon.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build Release for generic iOS device (unsigned validation)
        working-directory: ios
        run: |
          xcodebuild build -project MigraNote.xcodeproj -scheme MigraNote -configuration Release -destination 'generic/platform=iOS' -derivedDataPath release-build CODE_SIGNING_ALLOWED=NO
          APP="release-build/Build/Products/Release-iphoneos/MigraNote.app"
          test -s "$APP/Assets.car"
          echo "Release iOS compilata; catalogo icone presente. Firma Apple non verificata in questo job."
      - name: Upload unsigned Release app
        uses: actions/upload-artifact@v4
        with:
          name: MigraNote-iOS-Release-unsigned
          path: ios/release-build/Build/Products/Release-iphoneos/MigraNote.app
          if-no-files-found: error
      - name: Build and run unit tests (simulator-dependent)
        continue-on-error: true
        working-directory: ios
        run: xcodebuild test -project MigraNote.xcodeproj -scheme MigraNote -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' -derivedDataPath test-build CODE_SIGNING_ALLOWED=NO
