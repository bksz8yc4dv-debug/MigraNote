name: MigraNote
options:
  bundleIdPrefix: it.migranote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MigraNote:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MigraNote
        NSFaceIDUsageDescription: MigraNote usa Face ID solo per proteggere l'accesso al diario su questo dispositivo.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.migranote.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        GENERATE_INFOPLIST_FILE: YES
  MigraNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MigraNote

schemes:
  MigraNote:
    build:
      targets:
        MigraNote: all
    test:
      targets:
        - MigraNoteTests
