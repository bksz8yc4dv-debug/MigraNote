name: MigraNote
options:
  bundleIdPrefix: it.migranote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  MigraNote:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MigraNote
        NSFaceIDUsageDescription: MigraNote usa Face ID solo per proteggere l'accesso al diario su questo dispositivo.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.migranote.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - MigraNoteTests
  MigraNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MigraNote
