name: MigraNote
options:
  bundleIdPrefix: it.migranote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_CFBundleDisplayName: MigraNote
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
    GENERATE_INFOPLIST_FILE: YES
targets:
  MigraNote:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.migranote.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
